<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;background:#05060a;overflow:hidden}
  canvas{display:block;width:1280px;height:720px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/* Deterministic renderer for the background loop.
   frame(t) draws the scene at time t seconds; every moving term completes a whole
   number of cycles over DURATION so the last frame meets the first one seamlessly. */
const DURATION = 8;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const FIELDS = [
  { cx: .24, cy: .22, r: .70, c: [126, 154, 255], kx: 1, ky: 1, ph: 0.0 },
  { cx: .78, cy: .34, r: .62, c: [168, 130, 255], kx: 1, ky: 2, ph: 0.6 },
  { cx: .50, cy: .96, r: .78, c: [64, 198, 190],  kx: 2, ky: 1, ph: 1.3 },
];

const DUST = Array.from({ length: 38 }, (_, i) => ({
  x: (i * 0.6180339887) % 1,
  y: (i * 0.2718281828) % 1,
  z: 0.35 + ((i * 0.13) % 1) * 0.65,
  ph: (i * 0.7) % (Math.PI * 2),
  sp: 1 + (i % 3),
}));

window.frame = function frame(t) {
  const u = t / DURATION;                    // 0..1 over the loop
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (const f of FIELDS) {
    const x = (f.cx + Math.sin(2 * Math.PI * (u * f.kx + f.ph)) * 0.07) * W;
    const y = (f.cy + Math.cos(2 * Math.PI * (u * f.ky + f.ph)) * 0.08) * H;
    const r = f.r * Math.max(W, H) * 0.85;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${f.c[0]},${f.c[1]},${f.c[2]},0.20)`);
    g.addColorStop(0.45, `rgba(${f.c[0]},${f.c[1]},${f.c[2]},0.06)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
  for (const d of DUST) {
    const y = (d.y - u * 0.06 * d.sp + 2) % 1;
    const x = (d.x + Math.sin(2 * Math.PI * (u + d.ph)) * 0.012 + 1) % 1;
    const a = (0.16 + 0.42 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (u * 2 * d.sp + d.ph)))) * d.z;
    ctx.fillStyle = `rgba(206,218,255,${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(x * W, y * H, d.z * 1.5, 0, 6.2832);
    ctx.fill();
  }
};
window.frame(0);
window.READY = true;
</script>
</body>
</html>
